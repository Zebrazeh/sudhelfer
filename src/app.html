<meta charset="utf-8">

<title>Sudhelfer Einkochtopf</title>
<!--__PWA_HEAD__-->
<style>
/* Layout-Idee: Sudhaus-Leitstand. Links die großen Anzeigen (Temperatur, Rühren, Zeit), rechts die Arbeitsanweisung, unten Bestätigen. */
:root {
  --bg: #e6eae8;
  --panel: #f8faf9;
  --ink: #18201d;
  --muted: #56625d;
  --line: #c6d0cc;
  --accent: #9a4a1c;          /* Kupfer der Sudpfanne */
  --accent-ink: #ffffff;
  --heat: #b33a14; --hold: #85580a; --boil: #8a1d1d; --cool: #1d5a93; --stir: #2c6834; --hard: #1d4824;
  --ok: #2c6834; --warn: #8a5a00;
  /* nur Systemschriften: schmal und fett für Anzeigen, Systemschrift für Text */
  --font-display: "Avenir Next Condensed", "Helvetica Neue", "Bahnschrift", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", "DejaVu Sans Condensed", "Liberation Sans Narrow", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --panel: #19201d; --ink: #e9efec; --muted: #9aa8a2; --line: #2d3833;
    --accent: #e38b55; --accent-ink: #1a0f08;
    --heat: #b8401a; --hold: #8d6010; --boil: #9a2424; --cool: #22639f; --stir: #2f7239; --hard: #24562b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --panel: #19201d; --ink: #e9efec; --muted: #9aa8a2; --line: #2d3833;
  --accent: #e38b55; --accent-ink: #1a0f08;
  --heat: #b8401a; --hold: #8d6010; --boil: #9a2424; --cool: #22639f; --stir: #2f7239; --hard: #24562b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-stretch: condensed; font-weight: 800; letter-spacing: .01em; line-height: 1.05; margin: 0; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; display: flex; flex-direction: column; }
#view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- Kopfzeile ---------- */
.top { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-stretch: condensed; font-weight: 800; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
.rname { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.icobtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: .9rem; font-weight: 700; }
.icobtn:hover { border-color: var(--accent); }
.icobtn svg { width: 18px; height: 18px; }
.rail[hidden] { display: none; }
.rail { display: flex; gap: 3px; padding: 6px 16px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
.seg { flex: 1; min-width: 0; }
.seg b { display: block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.seg b i { display: block; height: 100%; background: var(--accent); }
.seg span { display: block; font-size: .72rem; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; text-transform: uppercase; letter-spacing: .03em; }
.seg.cur span { color: var(--ink); }
.seg.past b { background: var(--accent); opacity: .55; }

/* ---------- Knöpfe ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: var(--r); border: 2px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 60px; font-size: 1.2rem; padding: 12px 26px; }
.btn[aria-disabled="true"] { opacity: .45; }
.btn svg { width: 20px; height: 20px; }

/* ---------- Übersicht ---------- */
.ov { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(280px, 360px) 1fr; align-content: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 1.5rem; text-transform: uppercase; }
.card h3 { font-size: 1.15rem; text-transform: uppercase; color: var(--muted); }
.rtitle { font-size: clamp(1.8rem, 3.2vw, 2.6rem); text-transform: uppercase; }
.meta { color: var(--muted); font-size: .92rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.stat small { display: block; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
.stat strong { font-family: var(--font-display); font-stretch: condensed; font-size: 1.5rem; font-weight: 800; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.scale { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.scale input { width: 90px; min-height: 44px; padding: 6px 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); font-weight: 700; font-size: 1.1rem; }
.demo { background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; grid-column: 1 / -1; }
.demo .btn { background: var(--panel); color: var(--ink); border-color: var(--panel); }
.warns { border-left: 4px solid var(--warn); padding: 8px 12px; background: color-mix(in srgb, var(--warn) 10%, var(--panel)); border-radius: 6px; font-size: .92rem; }
.warns ul { margin: 4px 0 0; padding-left: 18px; }
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; counter-reset: ph; }
.ph { border: 1px solid var(--line); border-top: 5px solid var(--accent); border-radius: 8px; padding: 8px 10px; font-size: .88rem; background: var(--bg); }
.ph h4 { margin: 0 0 4px; font-family: var(--font-display); font-stretch: condensed; font-size: 1.1rem; text-transform: uppercase; }
.ph h4 small { display: block; font-family: var(--font-body); font-size: .72rem; color: var(--muted); font-weight: 700; text-transform: none; }
.ph ul { margin: 0; padding-left: 16px; }
.ph li { margin: 2px 0; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .axis text, .chart .lbl { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .pl { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--font-body); }
.chart .note { fill: var(--muted); font-size: 11px; }
.startbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--panel); padding: 6px 9px; border-radius: 6px; font-size: .85rem; max-width: 240px; }

/* ---------- Import ---------- */
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; background: var(--bg); }
.drop.over { border-color: var(--accent); }
.drop input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
textarea#paste { width: 100%; min-height: 110px; border: 2px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); font-family: ui-monospace, Menlo, monospace; font-size: .85rem; }
.qr { border: 2px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.qr input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.qr .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.qr input[type=text] { flex: 1; min-width: 180px; min-height: 48px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); }
.found { border-left: 5px solid var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.found ol { margin: 0; padding-left: 20px; }
.found a.btn { text-decoration: none; align-self: flex-start; }
.err { color: #fff; background: var(--boil); padding: 10px 12px; border-radius: 8px; font-weight: 700; }

/* ---------- Brau-Modus ---------- */
.brew { flex: 1; min-height: 0; display: grid; gap: 12px; padding: 12px 16px; grid-template-columns: minmax(280px, 5fr) minmax(0, 6fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "status task" "foot foot"; }
.status { grid-area: status; display: grid; gap: 12px; grid-template-rows: minmax(0, 1.5fr) minmax(0, 1fr) auto; min-height: 0; }
.status.notimer { grid-template-rows: minmax(0, 1.6fr) minmax(0, 1fr); }
.tile { border-radius: var(--r); padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; min-height: 0; overflow: hidden; position: relative; }
.tile .lbl { font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; opacity: .9; }
.t-temp { color: #fff; background: var(--muted); padding-right: 54px; }
.t-temp.m-heat { background: var(--heat); } .t-temp.m-hold { background: var(--hold); } .t-temp.m-boil { background: var(--boil); } .t-temp.m-cool { background: var(--cool); }
.t-temp.m-off { background: var(--panel); color: var(--ink); border: 2px solid var(--line); }
.tval { font-family: var(--font-display); font-stretch: condensed; font-weight: 800; line-height: .9; font-size: clamp(4rem, 10.5vw, 10rem); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tval sup { font-size: .38em; vertical-align: top; position: relative; top: .25em; margin-left: .04em; }
.tval .le { font-size: .5em; vertical-align: top; position: relative; top: .3em; margin-right: .06em; }
.tval.rng { font-size: clamp(2.6rem, 6.5vw, 6rem); }
.tval.none { font-size: clamp(2rem, 4.5vw, 3.6rem); line-height: 1; }
.mode { align-self: flex-start; margin-top: 6px; font-weight: 800; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; border: 2px solid currentColor; border-radius: 99px; padding: 2px 10px; }
.thermo { position: absolute; right: 16px; top: 14px; bottom: 14px; width: 14px; border-radius: 7px; border: 2px solid currentColor; opacity: .85; overflow: hidden; }
.thermo i { position: absolute; left: 0; right: 0; bottom: 0; background: currentColor; }
.t-stir { background: var(--panel); border: 2px solid var(--line); flex-direction: row; align-items: center; gap: 16px; }
.t-stir.s-on { background: var(--stir); color: #fff; border-color: var(--stir); }
.t-stir.s-hard { background: var(--hard); color: #fff; border-color: var(--hard); }
.t-stir svg { width: clamp(48px, 7vw, 92px); height: clamp(48px, 7vw, 92px); flex: none; }
.t-stir .sv { font-family: var(--font-display); font-stretch: condensed; font-weight: 800; font-size: clamp(1.9rem, 4.6vw, 4rem); line-height: .95; text-transform: uppercase; }
.t-stir .ss { font-size: .95rem; font-weight: 700; opacity: .92; margin-top: 4px; }
.t-stir.s-off .sv { color: var(--muted); }
.spin { transform-origin: 50% 50%; animation: spin 2.4s linear infinite; }
.s-hard .spin { animation-duration: .8s; }
@keyframes spin { to { transform: rotate(360deg); } }
.t-timer { background: var(--panel); border: 2px solid var(--line); gap: 2px; }
.t-timer .tt { font-family: var(--font-display); font-stretch: condensed; font-weight: 800; font-size: clamp(2.6rem, 6vw, 5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.t-timer .tsub { color: var(--muted); font-weight: 700; font-size: .92rem; }
.t-timer .tb { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.t-timer .tb button { min-height: 40px; padding: 6px 12px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); font-weight: 700; cursor: pointer; }
.t-timer.ring { border-color: var(--accent); animation: ring 1s steps(2, start) infinite; }
.t-timer.ring .tt { color: var(--accent); }
@keyframes ring { 50% { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); } }

.task > * { flex-shrink: 0; }
.brew > * { min-width: 0; }
.items .iv { overflow-wrap: anywhere; }
.task { grid-area: task; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.where { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; }
.task h1 { font-size: clamp(1.7rem, 3vw, 2.6rem); text-transform: uppercase; }
.task h1 small { display: block; font-family: var(--font-body); font-size: .9rem; color: var(--muted); text-transform: none; letter-spacing: 0; margin-top: 4px; font-weight: 700; }
.do { font-size: clamp(1.08rem, 1.6vw, 1.3rem); margin: 0; max-width: 62ch; }
.items { display: grid; grid-template-columns: auto 1fr; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.items div { padding: 6px 10px; border-top: 1px solid var(--line); }
.items div:nth-child(-n+2) { border-top: 0; }
.items .il { color: var(--muted); font-size: .85rem; font-weight: 700; white-space: nowrap; background: var(--bg); }
.items .iv { font-weight: 700; font-variant-numeric: tabular-nums; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px; cursor: pointer; font-weight: 700; }
.chk input { width: 26px; height: 26px; flex: none; accent-color: var(--ok); margin: 0; }
.chk:has(input:checked) { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--panel)); }
.info { color: var(--muted); font-size: .93rem; margin: 0; padding-left: 12px; border-left: 3px solid var(--line); }
.next { margin-top: auto; color: var(--muted); font-size: .9rem; border-top: 1px dashed var(--line); padding-top: 8px; }
.next b { color: var(--ink); }
.jodbtn { align-self: flex-start; }
.calc { border: 2px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.calc .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 12px; }
.calc label { display: flex; flex-direction: column; gap: 3px; font-size: .85rem; font-weight: 700; color: var(--muted); }
.calc input, .calc select { min-height: 46px; padding: 6px 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 1.1rem; font-weight: 700; color: var(--ink); width: 100%; }
.calc .seg2 { display: flex; gap: 6px; }
.calc .seg2 button { flex: 1; min-height: 42px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); font-weight: 700; cursor: pointer; }
.calc .seg2 button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.res { border-radius: 8px; padding: 10px 12px; background: var(--bg); display: flex; flex-direction: column; gap: 4px; }
.res.ok { border-left: 5px solid var(--ok); } .res.high { border-left: 5px solid var(--cool); } .res.low { border-left: 5px solid var(--warn); }
.res .big { font-family: var(--font-display); font-stretch: condensed; font-weight: 800; font-size: 1.7rem; line-height: 1.1; }
.res ul { margin: 2px 0 0; padding-left: 18px; }
.fin { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); max-width: 1180px; margin: 0 auto; width: 100%; }
.labelwrap { display: grid; grid-template-columns: minmax(160px, 260px) 1fr; gap: 16px; align-items: start; }
.labelwrap canvas { width: 100%; height: auto; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,.25); background: #f4ecd8; }
.labelwrap .fields { display: flex; flex-direction: column; gap: 8px; }
.labelwrap label { display: flex; flex-direction: column; gap: 3px; font-size: .85rem; font-weight: 700; color: var(--muted); }
.labelwrap input { min-height: 44px; padding: 6px 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 1rem; font-weight: 700; color: var(--ink); width: 100%; }
.abvbig { font-family: var(--font-display); font-stretch: condensed; font-weight: 800; font-size: 3.4rem; line-height: 1; }
.imgout img { max-width: 100%; border-radius: 6px; }
@media (max-width: 900px) { .fin { grid-template-columns: 1fr; } }
@media (max-width: 460px) { .labelwrap { grid-template-columns: 1fr; } }
.warnbox { border: 3px solid var(--boil); border-radius: 8px; padding: 12px 14px; background: color-mix(in srgb, var(--boil) 8%, var(--panel)); display: flex; flex-direction: column; gap: 6px; }
.warnbox h2 { font-size: 1.35rem; text-transform: uppercase; color: var(--boil); display: flex; gap: 8px; align-items: center; }
.warnbox h2 svg { width: 26px; height: 26px; flex: none; }
.warnbox ul { margin: 0; padding-left: 18px; }
.warnbox li { margin: 3px 0; }
:root[data-theme="dark"] .warnbox h2 { color: #ff8a80; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .warnbox h2 { color: #ff8a80; } }

.foot { grid-area: foot; display: flex; gap: 10px; align-items: stretch; }
.foot .back { flex: none; }
.done { flex: 1; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border: 2px solid var(--line); border-radius: var(--r); background: var(--panel); cursor: pointer; font-weight: 800; font-size: 1.15rem; min-height: 60px; }
.done input { width: 34px; height: 34px; accent-color: var(--ok); margin: 0; flex: none; }
.done:has(input:checked) { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel)); }
.foot .ok { flex: none; min-width: 140px; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ---------- Overlays ---------- */
.veil { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg { background: var(--panel); border-radius: var(--r); padding: 20px; max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.dlg h2 { font-size: 1.6rem; text-transform: uppercase; }
.dlg .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.sheet { background: var(--panel); border-radius: var(--r); width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet header h2 { font-size: 1.5rem; text-transform: uppercase; }
.sheet .body { overflow: auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.slist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.slist h3 { font-size: 1.05rem; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
.slist button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; cursor: pointer; }
.slist button:hover { border-color: var(--line); }
.slist .n { font-family: var(--font-display); font-stretch: condensed; font-weight: 800; width: 2.2em; color: var(--muted); }
.slist .st { margin-left: auto; font-size: .8rem; font-weight: 700; color: var(--muted); }
.slist .is-cur { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); border-color: var(--accent); }
.slist .is-done .t { color: var(--muted); text-decoration: line-through; }
.pre { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 10px; font-size: .93rem; }

/* ---------- Hochformat / schmale Geräte ---------- */
@media (max-width: 760px), (orientation: portrait) and (max-width: 900px) {
  .ov { grid-template-columns: 1fr; padding: 12px; }

/* ---------- QR-Code von maischemalzundmehr.de ---------- */
var MMUM = 'https://www.maischemalzundmehr.de/';
function exportUrl(id) { return MMUM + 'export_json.php?id=' + id + '&factoraw=0&factorsha=0&factorhav=0'; }
function qrSection() {
  var h = '<div class="qr"><strong>QR-Code von maischemalzundmehr.de</strong>' +

      '<span>Die App darf Daten anderer Webseiten nicht selbst laden. So kommt das Rezept herein:</span>' +
      '<ol><li>Tippe auf „JSON-Export öffnen“. Der Export öffnet sich im Browser.</li><li>Speichere die Datei oder markiere und kopiere den ganzen Text.</li><li>Komm zurück und wähle unten die Datei oder füge den Text ein.</li></ol>' +
      '<a class="btn primary" href="' + esc(exportUrl(qrFound)) + '" target="_blank" rel="noopener">JSON-Export öffnen</a>' +
      '<span class="meta">Adresse: ' + esc(exportUrl(qrFound)) + '</span></div>';
  }

}
function recipeIdFrom(text) {
  var t = String(text || '').trim();
  if (!t) return null;
  var m = t.match(/maischemalzundmehr\.de\/[^\s]*?[?&]id=(\d+)/i) || t.match(/[?&]id=(\d+)/) || t.match(/^#?(\d{1,7})$/);
  return m ? m[1] : null;
}
function useQrText(text) {
  var t = String(text || '').trim();
  if (t.charAt(0) === '{') { tryLoad(t, 'QR-Code'); return; }
  var id = recipeIdFrom(t);
  if (!id) { qrFound = null; renderImport('Darin steckt kein Rezept von maischemalzundmehr.de' + (t ? ' (gelesen: „' + t.slice(0, 80) + '“)' : '') + '. Erwartet wird ein Link wie www.maischemalzundmehr.de/index.php?id=89&inhaltmitte=rezept oder die Rezeptnummer.', true); return; }
  qrFound = id; renderImport(null, true);
  directFetch(id);
}
function directFetch(id) {
  /* klappt nur, wenn die Seite außerhalb von claude.ai läuft und der Server es erlaubt */
  try {
    if (!window.fetch || /claude|claudeusercontent/.test(location.hostname)) return;
    fetch(exportUrl(id)).then(function (r) { return r.ok ? r.text() : null; }).then(function (t) { if (t && qrFound === id) tryLoad(t, 'Rezept ' + id); }).catch(function () { });
  } catch (e) { }
}
function loadJsQR() {
  /* jsQR ist in diese Datei eingebettet (siehe Lizenz), es wird nichts nachgeladen */
  return window.jsQR ? Promise.resolve(window.jsQR) : Promise.reject(new Error('Die QR-Erkennung fehlt in dieser Datei.'));
}
function scanQrImage(file) {
  var url = URL.createObjectURL(file), img = new Image();
  img.onerror = function () { URL.revokeObjectURL(url); renderImport('Das Bild konnte nicht geöffnet werden. Nimm ein Foto im JPG- oder PNG-Format.', true); };
  img.onload = function () {
    URL.revokeObjectURL(url);
    var tryDetector = (window.BarcodeDetector ? new window.BarcodeDetector({ formats: ['qr_code'] }).detect(img).then(function (c) { return c.length ? c[0].rawValue : null; }).catch(function () { return null; }) : Promise.resolve(null));
    tryDetector.then(function (val) {
      if (val) return val;
      return loadJsQR().then(function (jsQR) {
        var sizes = [1400, 900, 600];
        for (var i = 0; i < sizes.length; i++) {
          var sc = Math.min(1, sizes[i] / Math.max(img.naturalWidth, img.naturalHeight));
          var w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
          var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          var cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
          var res = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
          if (res && res.data) return res.data;
        }
        return null;
      });
    }).then(function (val) {
      if (!val) { renderImport('Im Bild wurde kein QR-Code gefunden. Fotografiere den Code gerade, formatfüllend und scharf.', true); return; }
      useQrText(val);
    }).catch(function (e) { renderImport(e.message, true); });
  };

}
function readFile(f) {
  var r = new FileReader();

}
function tryLoad(text, name, isDemo) {
  try { parseRecipe(text); }
  catch (e) {
    var m = e instanceof SyntaxError ? 'Die Datei ist kein gültiges oder ein unvollständiges JSON (' + e.message + '). Lade den Export erneut herunter oder nimm eine BeerXML-Datei.' : e.message;
    renderImport(m); return;
  }
  var go = function () { st = fresh(text, name, isDemo); rebuild(); save(); render(); };
  if (st && st.started && !st.demo) {

function mashChart() {

  var X = function (t) { return L + t / p.total * (W - L - Rr); }, Y = function (v) { return T + (hi - v) / (hi - lo) * (H - T - B); };

  var labels = '', hits = '';

    var cx = (X(s.t0) + X(s.t1)) / 2, wpx = X(s.t1) - X(s.t0);

      if (!(mL > 0) || ($('#manS') && !(mS > 0 && mS <= 100))) { var bad = !(mL > 0) ? $('#manL') : $('#manS'); bad.classList.remove('shake'); void bad.offsetWidth; bad.classList.add('shake'); bad.focus(); break; }
      st.manual = { batchL: mL, sha: mS || (st.manual && st.manual.sha) || null }; st.scaleL = null; rebuild(); save(); renderOverview(); break;
    case 'manualReset': st.manual = null; st.scaleL = null; rebuild(); save(); renderOverview(); break;
    case 'dev': meas().dev = a.getAttribute('data-dev'); save(); var oc = $('#ogcalc'); if (oc) oc.outerHTML = ogCalcHtml(); break;
    case 'license': e.preventDefault(); sheet('Lizenz', '<div class="pre" style="font-family:ui-monospace,Menlo,monospace;font-size:.82rem">' + esc(LICENSE_TEXT) + '</div>'); break;
    case 'pdf': savePdf(); break;
    case 'saveLabel': saveLabel(false); break;
    case 'saveSheet': saveLabel(true); break;
    case 'qrText': useQrText($('#qrlink').value); break;
    case 'pasteLoad': var v = $('#paste').value.trim(); if (v) tryLoad(v, 'eingefügt'); else renderImport('Das Textfeld ist leer. Füge den JSON-Text aus dem Export ein.'); break;
    case 'cancelImport': render(); break;
    case 'toOverviewSheet': closeSheet(); renderOverview(); save(); break;
    case 'start': st.meas = null; st.carb = null; st.fg = null; st.alc = null; st.label = null; st.startedAt = now(); st.started = true; st.idx = 0; st.done = {}; st.checks = {}; st.confirm = {}; st.timers = {}; st.alarmed = {}; st.entered = {}; st.boil = null; enterStep(); keepAwake(); renderBrew(); break;
    case 'resume': keepAwake(); if (st.idx >= steps.length) st.idx = steps.length - 1; renderBrew(); save(); break;
    case 'restart': dialog('Von vorn beginnen?', '<p>Alle Häkchen und Timer werden zurückgesetzt.</p>', [{ label: 'Abbrechen' }, { label: 'Zurücksetzen', primary: true, fn: function () { st.started = false; st.idx = 0; st.done = {}; st.checks = {}; st.confirm = {}; st.timers = {}; st.alarmed = {}; st.entered = {}; st.boil = null; save(); renderOverview(); } }]); break;
    case 'ok': tryOk(); break;
    case 'back': if (st.idx > 0) { st.idx--; st.confirm[steps[st.idx].id] = false; save(); renderBrew(); } else { renderOverview(); save(); } break;
    case 'flow': showFlow(); break;
    case 'recipe': showRecipe(); break;
    case 'closeSheet': closeSheet(); break;
    case 'mute': st.muted = !st.muted; save(); renderTop(); break;
    case 'jump':
      var i = +a.getAttribute('data-i');
      if (i === st.idx) { closeSheet(); break; }
      dialog('Zu Schritt ' + (i + 1) + ' springen?', '<p><b>' + esc(steps[i].title) + '</b></p><p>Bestätigte Schritte bleiben bestätigt. Laufende Timer laufen weiter.</p>',
        [{ label: 'Abbrechen' }, { label: 'Springen', primary: true, fn: function () { closeSheet(); st.idx = i; enterStep(); renderBrew(); } }]);
      break;
    case 'jodfail':
      var ri = -1; steps.forEach(function (x, j) { if (x.id === s.jodRest) ri = j; });
      if (ri < 0) { dialog('Keine Rast gefunden', '<p>Halte die Maische weitere 10 Minuten auf ' + esc(fmtT(s.temp.value)) + ' und wiederhole die Jodprobe.</p>', [{ label: 'OK', primary: true }]); break; }
      dialog('Rast um 10 min verlängern?', '<p>Die App geht zurück zu „' + esc(steps[ri].title) + '“ und startet 10 Minuten. Danach folgt eine neue Jodprobe.</p>',
        [{ label: 'Abbrechen' }, { label: 'Rast +10 min', primary: true, fn: function () {
          var rs = steps[ri]; st.timers[rs.id] = { dur: 10 * 60000, start: now(), acc: 0 }; st.alarmed[rs.id] = false; st.done[rs.id] = false;
          st.idx = ri; st.confirm[rs.id] = false; save(); renderBrew(); } }]);
      break;
    case 'tpause': t = st.timers[s.id]; if (t) { if (t.start) { t.acc += now() - t.start; t.start = null; } else t.start = now(); save(); tick(true); } break;
    case 'tplus': t = st.timers[s.id]; if (t) { t.dur += 60000; if (tRemain(t) > 0) st.alarmed[s.id] = false; save(); tick(true); } break;
    case 'treset': dialog('Timer neu starten?', '<p>Der Timer beginnt wieder bei ' + fmtNum(s.timer.minutes, 1) + ' Minuten.</p>', [{ label: 'Abbrechen' }, { label: 'Neu starten', primary: true, fn: function () { st.timers[s.id] = { dur: s.timer.minutes * 60000, start: now(), acc: 0 }; st.alarmed[s.id] = false; save(); tick(true); } }]); break;
    case 'bpause': t = st.boil; if (t) { if (t.start) { t.acc += now() - t.start; t.start = null; } else t.start = now(); save(); tick(true); } break;
    case 'bplus': t = st.boil; if (t) { t.dur += 60000; save(); tick(true); } break;
    case 'boilRestart': dialog('Kochzeit neu starten?', '<p>Die Kochzeit beginnt wieder bei ' + fmtNum(RS.boilTime, 0) + ' Minuten. Alle Zugabezeitpunkte verschieben sich.</p>', [{ label: 'Abbrechen' }, { label: 'Neu starten', primary: true, fn: function () { st.boil = { dur: RS.boilTime * 60000, start: now(), acc: 0 }; steps.forEach(function (x) { if (x.phase === 'boil') st.alarmed[x.id] = false; }); save(); tick(true); } }]); break;
    case 'boilStartNow': st.boil = { dur: RS.boilTime * 60000, start: now(), acc: 0 }; save(); tick(true); break;
    case 'lastStep': st.idx = steps.length - 1; st.confirm[steps[st.idx].id] = false; renderBrew(); save(); break;
  }
});

/* Tooltips der Diagramme */
function tipMove(e) {
  var tip = $('#tip'), el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
  var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = e.clientY + 16;
  if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - 10;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
document.addEventListener('pointermove', tipMove);
document.addEventListener('pointerdown', tipMove);

/* ---------- Start ---------- */
function render() {
  if (st.mode === 'brew') { if (!st.started) st.mode = 'overview'; else { renderBrew(); return; } }
  if (st.mode === 'finished') { renderFinished(); return; }
  renderOverview();
}
function boot(data) {
  st = (data && data.raw) ? data : load();
  try { if (st && st.raw) rebuild(); else throw 0; }
  catch (e) { st = fresh(JSON.stringify(DEMO), 'Beispiel', true); rebuild(); }
  if (st.mode === 'import') st.mode = 'overview';
  if (st.demo && !st.started) { st.raw = JSON.stringify(DEMO); rebuild(); save(); }
  render();
  if (window.claude && window.claude.hot) window.claude.hot.snapshot(function () { return st; });
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot(window.claude && window.claude.hot && window.claude.hot.data || {});
/*__PWA_SW__*/
})();
</script>
